<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrida para a Câmara de Foz 2028</title>
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(#0b3d91,#06245a);color:#fff;text-align:center}
header{padding:18px 12px 8px}h1{margin:0;font-size:clamp(1.5rem,5vw,2.6rem);text-shadow:0 3px 0 #000}
.upd{color:#ffd700;font-weight:bold;margin:8px 0}main{width:100%;max-width:660px;margin:0 auto;padding:0}
video,img{display:block;width:100%;height:auto;box-sizing:border-box;border:3px solid #ffd700;border-radius:12px;box-shadow:0 6px 24px #0008;aspect-ratio:1350/5856}@media(max-width:700px){video,img{border-width:2px 0;border-radius:0}}
footer{font-size:.85rem;opacity:.85;padding:16px 14px 28px;max-width:760px;margin:0 auto}
.stage{position:relative}.hit{position:absolute;cursor:pointer;border-radius:10px;background:transparent;border:0;padding:0}
.hit:hover,.hit:focus-visible{outline:3px solid #ffd700;background:#ffd70022}
.dica{font-size:.95rem;margin:0 0 10px;opacity:.9}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9;text-align:left}
#modal.on{display:flex}
.box{background:#fff;color:#222;width:100%;max-width:660px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px;box-sizing:border-box}
@media(min-width:700px){#modal{align-items:center}.box{border-radius:16px}}
.box h2{margin:0 36px 4px 0;font-size:1.3rem}.x{position:sticky;top:0;float:right;font-size:1.6rem;border:0;background:#eee;border-radius:50%;width:40px;height:40px;cursor:pointer}
.sec{margin:14px 0 4px;padding:6px 10px;border-radius:8px;color:#fff;font-weight:bold}.pos{background:#2e7d32}.neg{background:#c62828}.neu{background:#757575}.cit{background:#9e9e9e}
.it{padding:8px 4px;border-bottom:1px solid #eee}.it small{color:#666}.it a{color:#0b3d91;font-weight:600;text-decoration:none}.it p{margin:3px 0 0;font-size:.88rem;color:#444}
.vazio{color:#888;font-size:.9rem;padding:4px}details summary{cursor:pointer}.apoio{display:inline-block;margin:6px 0 12px;padding:14px 26px;font-size:1.15rem;font-weight:bold;color:#06245a;background:#ffd700;border:0;border-radius:30px;cursor:pointer;box-shadow:0 4px 12px #0006}.apoio:hover{background:#ffe44d}#fmodal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10}#fmodal.on{display:flex}.fbox{background:#fff;color:#222;width:100%;max-width:700px;height:92vh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}.fbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}.fbar a{color:#0b3d91;font-size:.9rem}.fbox iframe{flex:1;border:0;width:100%}</style></head><body>
<header><h1>🏁 Corrida para a Câmara de Foz 2028</h1><p class="upd">Atualizado em 21/10/2026</p><button class="apoio" onclick="document.getElementById('fmodal').classList.add('on')">🗳️ Diga quem você apoia</button></header>
<div id="fmodal" onclick="if(event.target===this)this.classList.remove('on')"><div class="fbox"><div class="fbar"><a href="https://docs.google.com/forms/d/e/1FAIpQLSemoInBSO8ywiy6QJT2c_f2iCRyZ6ZuCgiPXxWkcUncKC-pcA/viewform" target="_blank" rel="noopener">abrir em nova aba</a><button class="x" aria-label="Fechar" onclick="document.getElementById('fmodal').classList.remove('on')">×</button></div><iframe src="https://docs.google.com/forms/d/e/1FAIpQLSemoInBSO8ywiy6QJT2c_f2iCRyZ6ZuCgiPXxWkcUncKC-pcA/viewform?embedded=true" loading="lazy" title="Diga quem você apoia">Carregando…</iframe></div></div>
<main><p class="dica">👆 Toque em um candidato para ver as matérias dele</p><div class="stage" id="stage"><video autoplay muted loop playsinline poster="corrida.png?v=1792628795" aria-label="Corrida para a Câmara de Foz 2028 – posição de cada pré-candidato"><source src="corrida.webm?v=1792628795" type="video/webm"><source src="corrida.mp4?v=1792628795" type="video/mp4"><img src="corrida.png?v=1792628795" alt="Corrida para a Câmara de Foz 2028"></video></div></main>
<div id="modal" role="dialog" aria-modal="true"><div class="box"><button class="x" aria-label="Fechar">×</button><div id="mc"></div></div></div>
<script>
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=d=>d?d.split('-').reverse().join('/'):'';
const li=a=>a.map(n=>`<div class="it"><small>${dt(n.data)} · ${esc(n.veiculo)}</small><br><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.titulo)}</a>${n.resumo?`<p>${esc(n.resumo.replace(/[.…\s]+$/,""))}…</p>`:''}</div>`).join('')||'<div class="vazio">Nenhuma matéria.</div>';
const M=document.getElementById('modal'),C=document.getElementById('mc');
function abre(r){C.innerHTML=`<h2>${r.rank}º ${esc(r.nome)}</h2>
<div class="sec pos">✅ Positivas (${r.pos.length})</div>${li(r.pos)}
<div class="sec neg">⚠️ Negativas (${r.neg.length})</div>${li(r.neg)}
<div class="sec neu">📰 Neutras (${r.neu.length})</div>${li(r.neu)}
<details><summary class="sec cit">Outras menções – só citado (${r.cit.length})</summary>${li(r.cit)}</details>`;M.classList.add('on');M.querySelector('.box').scrollTop=0}
function fecha(){M.classList.remove('on')}
M.onclick=e=>{if(e.target===M||e.target.classList.contains('x'))fecha()};document.onkeydown=e=>{if(e.key==='Escape')fecha()};
fetch('noticias.json?v=1792628795').then(r=>r.json()).then(D=>{const S=document.getElementById('stage');
 D.areas.forEach(a=>{const b=document.createElement('button');b.className='hit';b.title=b.ariaLabel=`${a.rank}º ${a.nome} – ver matérias`;
  Object.assign(b.style,{left:a.x*100+'%',top:a.y*100+'%',width:a.w*100+'%',height:a.h*100+'%'});b.onclick=()=>abre(D.noticias[a.slug]);S.appendChild(b)});
 if(location.hash)setTimeout(()=>{const k=location.hash.slice(1);D.noticias[k]&&abre(D.noticias[k])},0)});
</script>
<footer>Projeção estatística independente baseada em votos anteriores, redes sociais e presença na imprensa; não é pesquisa eleitoral registrada.</footer>
</body></html>
