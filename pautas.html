P.orgaos.forEach(o=>{const t=o.tubo,n=o.nivel;

 [z,z2,e].forEach(n=>n.addEventListener('click',ev=>{if(moved)return;show(o)}));});
function show(o){pc.innerHTML=`<h2>${o.nome}</h2><div>Termômetro: <b>${o.nivel}/100</b></div><div class="bar"><i style="width:${o.nivel}%;--w2:${100*100/Math.max(o.nivel,1)}%"></i></div>`+
 (o.problemas.length?o.problemas.map(p=>`<div class="pb"><b>${p.titulo}</b>${p.fato?'<br>'+p.fato:''}<br><small>${p.data.split('-').reverse().join('/')} · ${p.fonte}</small></div>`).join(''):'<p>Nenhum problema relevante registrado nos últimos 6 meses.</p>')+
 `<h3 style="margin:16px 0 4px;color:#157a2b">Notícias positivas ${'★'.repeat(o.estrelas)}${'☆'.repeat(5-o.estrelas)}</h3>`+(o.positivas.length?o.positivas.map(p=>`<div class="pos"><b>${p.titulo}</b><br>${p.fato}<br><small>${p.data.split('-').reverse().join('/')} · ${p.fonte}${p.obs?' · '+p.obs:''}${p.url?' · <a href="'+p.url+'" target="_blank" rel="noopener">ver matéria</a>':''}</small></div>`).join(''):'<p>Nenhuma notícia positiva de fato realizado registrada no período.</p>')+

// pan/zoom
let s=1,x=0,y=0,moved=false;const pts=new Map();let st=null;
function minS(){return Math.max(innerWidth/MW,innerHeight/MH)}
function clamp(){s=Math.min(Math.max(s,minS()),4);x=Math.min(0,Math.max(innerWidth-MW*s,x));y=Math.min(0,Math.max(innerHeight-MH*s,y))}
function ap(){clamp();map.style.transform=`translate(${x}px,${y}px) scale(${s})`}
function zoomAt(f,cx,cy){const ns=Math.min(Math.max(s*f,minS()),4);x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;ap()}
function reset(){s=minS();x=(innerWidth-MW*s)/2;y=(innerHeight-MH*s)/2;ap()}
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
vp.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;st=null;vp.classList.add('drag')});
addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;x+=dx;y+=dy;ap()}
 p.x=e.clientX;p.y=e.clientY;
 if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(st)zoomAt(d/st,(a.x+b.x)/2,(a.y+b.y)/2);st=d;moved=true}});
addEventListener('pointerup',e=>{pts.delete(e.pointerId);st=null;if(!pts.size)vp.classList.remove('drag')});
addEventListener('pointercancel',e=>{pts.delete(e.pointerId);st=null});
zi.onclick=()=>zoomAt(1.3,innerWidth/2,innerHeight/2);zo.onclick=()=>zoomAt(1/1.3,innerWidth/2,innerHeight/2);zr.onclick=reset;
addEventListener('resize',ap);reset();
